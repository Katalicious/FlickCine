<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <a href="landing.html" class="logo">
          <div class="logo-icon">
            <img
              src="../docs/img/Logo.png"
              alt="FlickCine Logo"
              class="img-light"
            />
            <img
              src="../docs/img/Logo dark.png"
              alt="FlickCine Logo"
              class="img-dark"
            />
          </div>
        </a>

        <nav class="navbar">
          <a href="landing.html">Home</a>
          <a href="#features">Sobre nós</a>
          <a href="#footer">Contacto</a>
          <a href="swipe.html" class="highlight-link">Explora os teus gostos</a>
        </nav>

        <div class="actions">
          <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
              <input type="checkbox" id="checkbox" />
              <div class="slider round">
                <span class="icon-sun">
                  <img
                    src="../docs/img/light.png"
                    alt="Sun"
                    class="img-light"
                  />
                  <img
                    src="../docs/img/light_mode.png"
                    alt="Sun"
                    class="img-dark"
                  />
                </span>

                <span class="icon-moon">
                  <img
                    src="../docs/img/dark_mode.png"
                    alt="Moon"
                    class="img-light"
                  />
                  <img src="../docs/img/dark.png" alt="Moon" class="img-dark" />
                </span>
              </div>
            </label>
          </div>
          <a href="login.html" class="btn btn-login">Login</a>
          <a href="register.html" class="btn btn-signup">Criar conta</a>
        </div>
      </div>
    </header>
    <ul>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <footer class="footer" id="footer">
      <div class="container footer-content">
        <div class="footer-left">
          <a href="#" class="logo footer-logo">
            <div class="logo-icon">
              <img
                src="../docs/img/Logo.png"
                alt="FlickCine Logo"
                class="img-light"
              />
              <img
                src="../docs/img/Logo dark.png"
                alt="FlickCine Logo"
                class="img-dark"
              />
            </div>
          </a>
          <div class="social-icons">
            <a href="#">
              <img src="../docs/img/X Logo.png" alt="X" class="img-light" />
              <img
                src="../docs/img/X Logo white.png"
                alt="X"
                class="img-dark"
              />
            </a>
            <a href="#">
              <img
                src="../docs/img/Logo Instagram.png"
                alt="Instagram"
                class="img-light"
              />
              <img
                src="../docs/img/Logo Instagram white.png"
                alt="Instagram"
                class="img-dark"
              />
            </a>
            <a href="#">
              <img
                src="../docs/img/Logo YouTube.png"
                alt="YouTube"
                class="img-light"
              />
              <img
                src="../docs/img/Logo YouTube white.png"
                alt="YouTube"
                class="img-dark"
              />
            </a>
            <a href="#">
              <img
                src="../docs/img/LinkedIn.png"
                alt="LinkedIn"
                class="img-light"
              />
              <img
                src="../docs/img/LinkedIn white.png"
                alt="LinkedIn"
                class="img-dark"
              />
            </a>
          </div>
        </div>

        <div class="footer-links">
          <a href="#">Sobre nós</a>
          <a href="#">Contactos</a>
          <a href="#">Política de privacidade</a>
          <a href="#">Termos e condições</a>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          Copyright 2025 © FlickCine. Todos os direitos reservados às respetivas
          entidades.
        </p>
      </div>
    </footer>
    <script src="darkmode.js"></script>
    <script src="swipe.js"></script>
  </body>
</html>
